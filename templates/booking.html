<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation pour {{competition['name']}} | GUDLFT — Réservations des compétitions</title>
</head>
<body>
    <h2>{{competition['name']}}</h2>
    <p>Date : {{competition['date'] | date_fr}}</p>
    Places disponibles : {{competition['numberOfPlaces']}}
    <form action="/purchasePlaces" method="post">
        <input type="hidden" name="club" value="{{club['name']}}">
        <input type="hidden" name="competition" value="{{competition['name']}}">
        <label for="places">Combien de places ?</label><input type="number" name="places" id="places"/>
        <button type="submit">Réserver</button>
    </form>
</body>
</html>
