{% extends "base.html" %}

{% block title %}Connexion | GUDLFT — Réservations des compétitions{% endblock %}

{% block content %}
<section class="panel panel-login">
    <h1>Bienvenue sur le portail de réservation GUDLFT</h1>
    <p class="lead-text">Veuillez saisir votre adresse e-mail de secrétaire pour continuer :</p>

    <form action="{{ url_for('showSummary') }}" method="post">
        <div class="form-group">
            <label for="email" class="form-label">Adresse e-mail :</label>
            <input type="email" name="email" id="email" class="form-input" required>
        </div>
        <button type="submit" class="btn">Se connecter</button>
    </form>

    <div class="secondary-actions">
        <a href="{{ url_for('points') }}">Voir les points des clubs</a>
    </div>
</section>
{% endblock %}
