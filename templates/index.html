<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDLFT — Réservations des compétitions</title>
</head>
<body>
    <h1>Bienvenue sur le portail de réservation GUDLFT</h1>
    Veuillez saisir votre adresse e-mail de secrétaire pour continuer :
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <ul>
        {% for message in messages %}
            <li>{{message}}</li>
        {% endfor %}
        </ul>
    {% endif %}
    {% endwith %}
    <form action="showSummary" method="post">
        <label for="email">Adresse e-mail :</label>
        <input type="email" name="email" id="email"/>
        <button type="submit">Se connecter</button>
    </form>
    <a href="{{ url_for('points') }}">Voir les points des clubs</a>
</body>
</html>
